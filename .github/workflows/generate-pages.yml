name: শাড়ির পেজ ও sitemap বানাও

on:
  workflow_dispatch:        # হাতে "Run workflow" চাপলে চলবে
  schedule:
    - cron: "0 */6 * * *"   # প্রতি ৬ ঘণ্টায় নিজে নিজে চলবে
  push:
    paths:
      - "scripts/generate-pages.mjs"
      - ".github/workflows/generate-pages.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-pages.mjs
      - name: পরিবর্তন থাকলে সেভ করো
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saree sitemap.xml
          if git diff --cached --quiet; then echo "কোনো পরিবর্তন নেই"; else git commit -m "শাড়ির পেজ ও sitemap আপডেট" && git push; fi
